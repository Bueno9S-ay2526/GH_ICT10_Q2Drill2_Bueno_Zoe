<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Pyscript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Drill 2</title>
</head>
<body style="background-color: rgb(15, 126, 162);">
    <nav class="navbar navbar-expand-sm" style="background-color: #000000; color: rgb(96, 236, 255); padding: 20px; margin-bottom: 55px;">
        <h3>ICT Club</h3>
    </nav>
    <main id="whole" style="background-color: black; color: rgb(96, 236, 255); margin: 0 auto; padding: 40px; width: 55%; text-align: center; line-height: 1.7; border-radius: 7px; height: 100%; flex: 1; min-height: 70vh">
        <h2>Are YOU a member of the ICT club?!</h2><br>
        <form>
            <input type="text" class="form-control" id="surname" placeholder="Please enter you surname"><br>
            <input type="text" class="form-control" id="first_name" placeholder="Please enter you first name"><br>
        </form>
        <button type="submit" py-click="check_members" class="btn mt-3" style="background-color: rgb(15, 126, 162); color: #000000;">Verify membership!</button><br><br>
        <div id="result_box" style="border: 1px solid rgb(15, 126, 162); padding: 20px; width: 70%; margin: 0 auto;"></div>
    </main>    
    <py-script src="main.py"></py-script>
</body>
</html>
